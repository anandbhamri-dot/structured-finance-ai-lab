<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLO Indenture Interpreter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --paper: #EEF1F3; --panel: #FFFFFF; --panel-2: #F7F9FA; --ink: #17212B; --ink-2: #33414E; --muted: #5E6B77; --faint: #8C97A1;
  --rule: #D5DCE1; --rule-2: #E6EAED; --accent: #1D4E89; --accent-soft: #E3ECF6;
  --flow: #1F7A6A; --flow-soft: #DDEFEA; --divert: #A2600B; --divert-soft: #F6EAD6;
  --fail: #B3261E; --fail-soft: #F8E1DF; --pass: #2B7A3D; --pass-soft: #E1F0E4; --na: #8C97A1;
  --cat-exp: #8E9AA5; --cat-int: #1D4E89; --cat-cure: #A2600B; --cat-fee: #5B6E86; --cat-irt: #C98E2E; --cat-eq: #1F7A6A; --cat-rein: #3E9B87;
  --shadow: 0 1px 0 rgba(23, 33, 43, .04); --scrim: rgba(23, 33, 43, .32); --drawer-shadow: -18px 0 40px rgba(23, 33, 43, .16);
  --serif: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', serif;
  --sans: 'Public Sans', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10161D; --scrim: rgba(0, 0, 0, .55); --drawer-shadow: -18px 0 40px rgba(0, 0, 0, .45); --panel: #18212A; --panel-2: #1D2731; --ink: #E5EAEE; --ink-2: #C8D0D7; --muted: #95A2AE; --faint: #6D7A86;
    --rule: #2C3946; --rule-2: #24303B; --accent: #7FAEE6; --accent-soft: #1C2F45;
    --flow: #5CC2AA; --flow-soft: #17342E; --divert: #E3A54B; --divert-soft: #3A2C17;
    --fail: #F08A80; --fail-soft: #3D1F1D; --pass: #7CC98C; --pass-soft: #1B3322;
    --cat-exp: #6D7A86; --cat-int: #6E9FD8; --cat-cure: #E3A54B; --cat-fee: #8EA0B6; --cat-irt: #F0C060; --cat-eq: #5CC2AA; --cat-rein: #3E9B87;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10161D; --scrim: rgba(0, 0, 0, .55); --drawer-shadow: -18px 0 40px rgba(0, 0, 0, .45); --panel: #18212A; --panel-2: #1D2731; --ink: #E5EAEE; --ink-2: #C8D0D7; --muted: #95A2AE; --faint: #6D7A86;
  --rule: #2C3946; --rule-2: #24303B; --accent: #7FAEE6; --accent-soft: #1C2F45;
  --flow: #5CC2AA; --flow-soft: #17342E; --divert: #E3A54B; --divert-soft: #3A2C17;
  --fail: #F08A80; --fail-soft: #3D1F1D; --pass: #7CC98C; --pass-soft: #1B3322;
  --cat-exp: #6D7A86; --cat-int: #6E9FD8; --cat-cure: #E3A54B; --cat-fee: #8EA0B6; --cat-irt: #F0C060; --cat-eq: #5CC2AA; --cat-rein: #3E9B87;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
img, svg { max-width: 100%; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* masthead */
.mast { display: grid; grid-template-columns: 1fr auto; gap: 16px 24px; align-items: end; padding: 22px 28px 16px; border-bottom: 1px solid var(--rule); background: var(--panel); }
.mast .tool { font-size: 12.5px; color: var(--muted); margin: 0 0 4px; }
.mast h1 { font: 600 30px/1.1 var(--serif); letter-spacing: -0.01em; margin: 0; }
.mast .doc { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.mast .doc b { color: var(--ink-2); font-weight: 600; }
.deal-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
select, input[type=text], input[type=number], textarea { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; min-height: 32px; }
textarea { width: 100%; resize: vertical; line-height: 1.4; box-sizing: border-box; }
.rule .txt .ref { white-space: normal; overflow-wrap: anywhere; }
select { padding-right: 26px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 6px 12px; min-height: 32px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0E1620; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0E1620; } }
.btn.small { min-height: 26px; padding: 3px 9px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; cursor: default; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 500; }

/* layout */
.layout { display: grid; grid-template-columns: 318px minmax(0, 1fr); min-height: calc(100vh - 100px); }
.rail { border-right: 1px solid var(--rule); background: var(--panel-2); padding: 16px 16px 40px; }
.main { padding: 22px 28px 60px; min-width: 0; }
.rail-toggle { display: none; }

/* rail */
.grp { border-top: 1px solid var(--rule); padding: 12px 0 4px; }
.grp:first-child { border-top: 0; padding-top: 0; }
.grp > h3 { font: 600 13px/1.3 var(--sans); margin: 0 0 8px; color: var(--ink); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.grp > h3 small { font-weight: 400; color: var(--muted); font-size: 12px; }
.scen { display: grid; gap: 6px; }
.scen button { text-align: left; border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 8px 10px; cursor: pointer; }
.scen button b { display: block; font-weight: 600; font-size: 13px; }
.scen button span { display: block; color: var(--muted); font-size: 12px; line-height: 1.35; margin-top: 2px; }
.scen button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.field { display: grid; grid-template-columns: 1fr 128px; gap: 8px; align-items: center; margin: 0 0 7px; }
.field label { font-size: 12.5px; color: var(--ink-2); line-height: 1.25; }
.field label small { display: block; color: var(--faint); font-size: 11.5px; }
.field input, .field select { width: 100%; text-align: right; min-height: 30px; padding: 4px 8px; }
.field select { text-align: left; }
.field.wide { grid-template-columns: 1fr; }
.field.wide input, .field.wide select { text-align: left; }
.notes-grid { display: grid; grid-template-columns: 34px 1fr 1fr; gap: 5px 6px; align-items: center; font-size: 12.5px; }
.notes-grid .h { color: var(--muted); font-size: 11.5px; }
.notes-grid input { width: 100%; text-align: right; min-height: 28px; padding: 3px 6px; }
.range { display: grid; grid-template-columns: 1fr 56px; gap: 8px; align-items: center; margin: 0 0 8px; }
.range label { font-size: 12.5px; color: var(--ink-2); grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.range label output { white-space: nowrap; flex: none; }
.range label output { color: var(--ink); font-weight: 600; }
.range input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--divert); }
.check { display: flex; gap: 8px; align-items: center; font-size: 12.5px; margin: 0 0 8px; }
.hint { color: var(--muted); font-size: 12px; margin: 2px 0 8px; line-height: 1.4; }
.period-line { font-size: 12.5px; color: var(--muted); margin: -2px 0 10px; }
.period-line b { color: var(--ink); font-weight: 600; }

/* verdict */
.verdict { max-width: 860px; }
.verdict .when { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
.verdict p.say { font: 400 19px/1.5 var(--serif); margin: 0 0 10px; color: var(--ink); }
.verdict p.say strong { font-weight: 600; }
.alerts { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 0; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink-2); white-space: nowrap; }
.tag.fail { background: var(--fail-soft); border-color: transparent; color: var(--fail); }
.tag.warn { background: var(--divert-soft); border-color: transparent; color: var(--divert); }
.tag.ok { background: var(--pass-soft); border-color: transparent; color: var(--pass); }
.tag.na { color: var(--muted); }
.tag i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; }

/* coverage strip */
.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; margin: 20px 0 22px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); overflow: hidden; }
.cell { padding: 11px 13px 12px; border-left: 1px solid var(--rule-2); min-width: 0; }
.cell:first-child { border-left: 0; }
.cell .t { font-size: 12.5px; font-weight: 600; display: flex; justify-content: space-between; gap: 6px; }
.cell .t .st { font-weight: 600; font-size: 11.5px; }
.cell .v { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 4px 0 0; }
.cell .s { font-size: 12px; color: var(--muted); }
.cell .bar { position: relative; height: 4px; background: var(--rule-2); border-radius: 2px; margin: 8px 0 6px; }
.cell .bar span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--pass); }
.cell .bar em { position: absolute; top: -3px; width: 2px; height: 10px; background: var(--ink); }
.cell.failing { background: var(--fail-soft); }
.cell.failing .bar span { background: var(--fail); }
.cell .ic { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.st.pass { color: var(--pass); } .st.fail { color: var(--fail); } .st.na { color: var(--na); }

/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); margin: 0 0 18px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 9px 14px 10px; cursor: pointer; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button .n { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--fail-soft); color: var(--fail); font-size: 11px; margin-left: 4px; }
.panel[hidden] { display: none; }

/* allocation bar */
.alloc { margin: 0 0 18px; }
.alloc .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 0 8px; flex-wrap: wrap; }
.alloc .head h3 { margin: 0; font: 600 15px/1.3 var(--sans); }
.alloc .head .tot { color: var(--muted); font-size: 13px; }
.alloc .bar { display: flex; height: 30px; border-radius: 6px; overflow: hidden; background: var(--rule-2); }
.alloc .bar span { display: block; height: 100%; min-width: 2px; position: relative; }
.alloc .bar span + span { box-shadow: -1px 0 0 var(--panel); }
.alloc .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 8px 0 0; font-size: 12.5px; color: var(--ink-2); }
.alloc .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.alloc .legend b { font-weight: 600; color: var(--ink); margin-left: 4px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 5px 12px; cursor: pointer; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.seg button + button { border-left: 1px solid var(--rule); }

/* ledger */
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 8px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--rule-2); }
th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--panel-2); position: sticky; top: 0; z-index: 1; white-space: nowrap; }
td.num, th.num { text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.ledger td.step { width: 40px; font: 600 15px/1.2 var(--serif); color: var(--accent); }
.ledger .what { min-width: 280px; max-width: 520px; }
.ledger .what b { font-weight: 600; display: block; }
.ledger .what .cl { font: 400 13.5px/1.45 var(--serif); color: var(--ink-2); margin: 2px 0 0; }
.ledger .what .ref { font-size: 11.5px; color: var(--accent); margin-left: 6px; white-space: nowrap; font-family: var(--sans); }
.ledger .what .nt { font-size: 12.5px; margin: 5px 0 0; color: var(--ink-2); }
.ledger .what .sect, .cd-body .sect { font-size: 11.5px; color: var(--accent); margin: 3px 0 0; }
details.docw { margin: 4px 0 0; font-size: 12.5px; }
details.docw summary { cursor: pointer; color: var(--accent); font-weight: 500; width: max-content; max-width: 100%; }
details.docw summary .ref { margin-left: 6px; color: var(--muted); font-weight: 400; }
details.docw p { margin: 6px 0 2px; padding: 8px 10px; border-left: 3px solid var(--rule); background: var(--panel-2); color: var(--ink-2); font: 400 13px/1.5 var(--serif); white-space: pre-line; max-height: 320px; overflow: auto; }
.docbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 12.5px; color: var(--ink-2); margin: 0 0 14px; }
.docbar > span:first-child { flex: 1 1 320px; }
.cd-body details.docw { margin: -4px 0 16px; }
.ledger .what .nt.d { color: var(--divert); font-weight: 500; }
.ledger .what .nt.f { color: var(--fail); font-weight: 500; }
.ledger .pay { margin: 5px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--muted); }
.ledger .pay li { display: flex; justify-content: space-between; gap: 12px; max-width: 360px; }
.ledger tr.skip td { color: var(--faint); }
.ledger tr.skip .what .cl { color: var(--faint); }
.ledger tr.divert { background: linear-gradient(90deg, var(--divert-soft), transparent 55%); }
.ledger tr.short td.sh { color: var(--fail); font-weight: 600; }
.ledger td.rem { width: 170px; }
.rembar { height: 8px; border-radius: 4px; background: var(--rule-2); position: relative; overflow: hidden; margin-top: 6px; }
.rembar span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--flow); border-radius: 4px; }
.rembar.dv span { background: var(--divert); }
.remv { font-size: 12.5px; text-align: right; }
.testline { display: inline-flex; gap: 6px; align-items: baseline; font-size: 12.5px; margin-top: 5px; flex-wrap: wrap; }
.testline .arrow { color: var(--faint); }

/* tests tab */
.sec { margin: 0 0 26px; }
.sec > h2 { font: 600 17px/1.3 var(--serif); margin: 0 0 4px; }
.sec > p.lead { color: var(--muted); margin: 0 0 12px; font-size: 13px; max-width: 760px; }
.res { font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.res.pass { color: var(--pass); } .res.fail { color: var(--fail); } .res.na { color: var(--na); font-weight: 500; }
.small { font-size: 12px; color: var(--muted); }
.ref { color: var(--accent); font-size: 12px; white-space: nowrap; }
.bridge td:first-child { color: var(--ink-2); }
.bridge tr.total td { font-weight: 600; border-top: 1px solid var(--rule); }
.bridge td.neg { color: var(--fail); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; }
.selects { display: flex; gap: 16px; flex-wrap: wrap; margin: 0 0 10px; align-items: center; font-size: 13px; }
.selects label { display: flex; gap: 8px; align-items: center; color: var(--ink-2); }

/* portfolio */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); margin: 0 0 16px; overflow: hidden; }
.kpis div { padding: 10px 12px; border-left: 1px solid var(--rule-2); }
.kpis div:first-child { border-left: 0; }
.kpis b { display: block; font-size: 17px; font-weight: 600; }
.kpis span { font-size: 12px; color: var(--muted); }
.tape { font-size: 12.5px; }
.tape td, .tape th { padding: 5px 8px; white-space: nowrap; }
.flag { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 0 5px; border-radius: 3px; margin-right: 3px; }
.flag.def { background: var(--fail-soft); color: var(--fail); }
.flag.ccc { background: var(--divert-soft); color: var(--divert); }
.flag.dsc { background: var(--accent-soft); color: var(--accent); }
.flag.cl { background: var(--rule-2); color: var(--muted); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 12px; }
.toolbar .src { color: var(--muted); font-size: 12.5px; margin-right: auto; }

/* indenture tab */
.rule { display: grid; grid-template-columns: 54px minmax(0, 1fr) minmax(0, 300px); gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--rule-2); }
.rule .id { font: 600 15px/1.3 var(--serif); color: var(--accent); }
.rule .txt { font: 400 14.5px/1.5 var(--serif); }
.rule .txt b { font-family: var(--sans); font-weight: 600; font-size: 13.5px; display: block; margin-bottom: 2px; }
.rule .cfg { font: 12px/1.45 var(--mono); color: var(--ink-2); background: var(--panel-2); border: 1px solid var(--rule-2); border-radius: 6px; padding: 7px 9px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
.kv { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 4px 16px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.box { border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); padding: 16px 18px; }
.box + .box { margin-top: 14px; }
.interp h3 { margin: 0 0 6px; font: 600 15px/1.3 var(--sans); }
.drop { border: 1.5px dashed var(--rule); border-radius: 8px; padding: 18px; text-align: center; color: var(--muted); background: var(--panel-2); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.log { font: 12px/1.5 var(--mono); background: var(--panel-2); border: 1px solid var(--rule-2); border-radius: 6px; padding: 8px 10px; max-height: 200px; overflow: auto; white-space: pre-wrap; color: var(--ink-2); }
.excerpts { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
ul.errs { margin: 6px 0; padding-left: 18px; font-size: 13px; }
ul.errs li.e { color: var(--fail); } ul.errs li.w { color: var(--divert); }
.assump { margin: 0; padding-left: 18px; font: 14px/1.55 var(--serif); color: var(--ink-2); }
.assump li { margin: 0 0 6px; }
.notice { font-size: 12.5px; color: var(--ink-2); background: var(--accent-soft); border-radius: 6px; padding: 8px 10px; margin: 0 0 12px; }
.notice.warn { background: var(--divert-soft); }
.notice.err { background: var(--fail-soft); color: var(--fail); }
/* calculation links and the working panel */
button.calc { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline dotted; text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent); text-underline-offset: 3px; font-variant-numeric: tabular-nums; }
button.calc:hover { text-decoration-style: solid; text-decoration-color: var(--accent); }
.ledger tr.skip button.calc { color: var(--faint); }
.alloc .tot button.calc { color: var(--accent); font-weight: 600; }
dialog.calcd { position: fixed; inset: 0 0 0 auto; margin: 0; width: min(640px, 100vw); height: 100%; max-height: 100%; max-width: 100vw; padding: 0; border: 0; border-left: 1px solid var(--rule); background: var(--panel); color: var(--ink); box-shadow: var(--drawer-shadow); overflow: hidden; display: none; }
dialog.calcd[open] { display: flex; flex-direction: column; animation: cd-in .18s ease-out; }
dialog.calcd::backdrop { background: var(--scrim); }
@keyframes cd-in { from { transform: translateX(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.cd-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: calc(18px + env(safe-area-inset-top, 0px)) calc(22px + env(safe-area-inset-right, 0px)) 14px 22px; border-bottom: 1px solid var(--rule); }
.cd-head h2 { font: 600 21px/1.25 var(--serif); margin: 2px 0 0; text-wrap: balance; }
.cd-kicker { font-size: 12.5px; color: var(--muted); margin: 0; }
